spring.profiles.active=dev
spring.application.name=austin

########################################## auth start ##########################################
spring.session.store-type=redis
spring.session.redis.namespace=austin:session
server.servlet.session.timeout=8h
austin.auth.bootstrap.enabled=${AUSTIN_AUTH_BOOTSTRAP_ENABLED:false}
austin.auth.bootstrap.username=${AUSTIN_AUTH_BOOTSTRAP_USERNAME:dev-user}
austin.auth.bootstrap.password=${AUSTIN_AUTH_BOOTSTRAP_PASSWORD:}
austin.auth.bootstrap.display-name=${AUSTIN_AUTH_BOOTSTRAP_DISPLAY_NAME:Austin 管理员}
austin.admin.origin=${AUSTIN_ADMIN_ORIGIN:http://localhost:3000}
########################################## auth end ##########################################

########################################## channel policy start ##########################################
# Personal-developer defaults: IM, Mock SMS, email, Feishu robot and generic Webhook.
# Channel codes are stable; removing a code only hides/blocks it and never deletes historical templates.
austin.channels.enabled=${AUSTIN_ENABLED_CHANNELS:10,30,40,110,130}
austin.channels.sms.enabled-scripts=${AUSTIN_ENABLED_SMS_SCRIPTS:MockSmsScript}
########################################## channel policy end ##########################################

########################################## email start ##########################################
# SMTP credentials are read from environment variables and are never persisted to the database.
austin.email.smtp.host=${AUSTIN_SMTP_HOST:}
austin.email.smtp.port=${AUSTIN_SMTP_PORT:}
austin.email.smtp.user=${AUSTIN_SMTP_USER:}
austin.email.smtp.from=${AUSTIN_SMTP_FROM:}
austin.email.smtp.auth-code=${AUSTIN_SMTP_AUTH_CODE:}
austin.email.smtp.ssl-enabled=${AUSTIN_SMTP_SSL_ENABLED:true}
austin.email.smtp.starttls-enabled=${AUSTIN_SMTP_STARTTLS_ENABLED:false}

# Explicitly opt in to the fixed-recipient integration-test endpoint.
austin.email.test.enabled=${AUSTIN_EMAIL_TEST_ENABLED:false}
austin.email.test.to=${AUSTIN_EMAIL_TEST_TO:}
########################################## email end ##########################################

########################################## feishu robot start ##########################################
# The real webhook and administrator token must come from environment variables or external secret config.
austin.feishu.robot.enabled=${AUSTIN_FEISHU_ROBOT_ENABLED:false}
austin.feishu.robot.webhook=${AUSTIN_FEISHU_ROBOT_WEBHOOK:}

# The endpoint is additionally restricted to dev/local profiles and is disabled by default.
austin.feishu.robot.test.enabled=${AUSTIN_FEISHU_TEST_ENABLED:false}
austin.feishu.robot.test.admin-token=${AUSTIN_FEISHU_TEST_ADMIN_TOKEN:}
########################################## feishu robot end ##########################################

########################################## alipay sandbox payment start ##########################################
# 支付通用配置：支付完成后浏览器跳转地址（return_url，本机地址即可）与取消支付跳转地址
# 支付宝沙箱支付：密钥全部由环境变量注入，默认关闭；notify-url需为公网可达的完整地址，指向 POST /billing/payments/webhooks/alipay
austin.billing.payment.alipay.enabled=${AUSTIN_ALIPAY_SANDBOX_ENABLED:false}
austin.billing.payment.alipay.gateway-url=${AUSTIN_ALIPAY_SANDBOX_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
austin.billing.payment.alipay.app-id=${AUSTIN_ALIPAY_SANDBOX_APP_ID:}
austin.billing.payment.alipay.app-private-key=${AUSTIN_ALIPAY_SANDBOX_APP_PRIVATE_KEY:}
austin.billing.payment.alipay.alipay-public-key=${AUSTIN_ALIPAY_SANDBOX_PUBLIC_KEY:}
austin.billing.payment.alipay.notify-url=${AUSTIN_ALIPAY_SANDBOX_NOTIFY_URL:}
austin.billing.payment.alipay.checkout-base-url=${AUSTIN_ALIPAY_SANDBOX_CHECKOUT_BASE_URL:http://localhost:7778}
########################################## alipay sandbox payment end ##########################################

########################################## database start ##########################################
# TODO required!
# notice:mysql version 5.7x !!!
spring.datasource.url=jdbc:mysql://${austin.database.ip:austin-mysql}:${austin.database.port:3306}/austin?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
spring.datasource.username=${austin.database.username:root}
spring.datasource.password=${austin.database.password:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=1000

# Flyway owns the Austin application schema. Existing non-empty databases must be
# baselined explicitly once; the default stays false so an unknown schema cannot be
# silently accepted during startup.
spring.flyway.enabled=${AUSTIN_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${AUSTIN_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=none

# Compatibility default: existing Austin installations have zero quota after V4.
# Enable this explicitly in SaaS sandbox environments after granting test quota.
austin.billing.quota-enforcement-enabled=${AUSTIN_BILLING_QUOTA_ENFORCEMENT_ENABLED:false}
austin.billing.payment.checkout-success-url=${AUSTIN_PAYMENT_SUCCESS_URL:${AUSTIN_BILLING_CHECKOUT_SUCCESS_URL:http://localhost:3000/#/billing/payments/result}}
austin.billing.payment.checkout-cancel-url=${AUSTIN_PAYMENT_CANCEL_URL:${AUSTIN_BILLING_CHECKOUT_CANCEL_URL:http://localhost:3000/#/billing/purchase}}
# Payment providers are opt-in. Secret properties have no committed value and must be injected
# by the runtime secret manager/environment when the corresponding provider is enabled.
austin.billing.payment.mock.enabled=${AUSTIN_MOCK_PAYMENT_ENABLED:false}
austin.billing.payment.mock.checkout-base-url=${AUSTIN_MOCK_PAYMENT_CHECKOUT_BASE_URL:http://localhost:8080}
austin.billing.payment.mock.signing-secret=${AUSTIN_MOCK_PAYMENT_SIGNING_SECRET}
austin.billing.payment.stripe.enabled=${AUSTIN_STRIPE_ENABLED:false}
austin.billing.payment.stripe.api-key=${AUSTIN_STRIPE_API_KEY}
austin.billing.payment.stripe.webhook-secret=${AUSTIN_STRIPE_WEBHOOK_SECRET}
austin.billing.payment.stripe-intent.enabled=${AUSTIN_STRIPE_INTENT_ENABLED:false}
austin.billing.payment.stripe-intent.api-key=${AUSTIN_STRIPE_API_KEY}
austin.billing.payment.stripe-intent.publishable-key=${AUSTIN_STRIPE_PUBLISHABLE_KEY}
austin.billing.payment.stripe-intent.webhook-secret=${AUSTIN_STRIPE_WEBHOOK_SECRET}
# Shared 32-byte Base64 master key for clustered deployments; local mode persists an owner-only key file.
austin.billing.payment.config.encryption-key=${AUSTIN_PAYMENT_CONFIG_ENCRYPTION_KEY:}
austin.billing.payment.config.key-file=${AUSTIN_PAYMENT_CONFIG_KEY_FILE:${user.home}/.austin/payment-config.key}
austin.billing.outbox.enabled=true
austin.billing.outbox.scan-interval-ms=5000
austin.billing.outbox.scan-batch-size=100
austin.billing.outbox.lease-seconds=60
austin.report.generation.enabled=true
austin.report.monthly-auto-enqueue-enabled=true
austin.report.scan-interval-ms=10000
austin.report.scan-batch-size=10
austin.report.lease-seconds=300
austin.report.max-ledger-rows=5000
austin.report.max-payment-detail-rows=1000
austin.report.storage.provider=LOCAL
austin.report.storage.local.base-dir=${AUSTIN_REPORT_STORAGE_LOCAL_BASE_DIR:${java.io.tmpdir}/austin-reports}
austin.mq.inbox.max-attempts=${AUSTIN_MQ_INBOX_MAX_ATTEMPTS:5}
austin.mq.inbox.lease-seconds=${AUSTIN_MQ_INBOX_LEASE_SECONDS:60}
austin.mq.inbox.retry-base-seconds=${AUSTIN_MQ_INBOX_RETRY_BASE_SECONDS:5}
austin.mq.inbox.scan-interval-ms=${AUSTIN_MQ_INBOX_SCAN_INTERVAL_MS:5000}
austin.mq.inbox.scan-batch-size=${AUSTIN_MQ_INBOX_SCAN_BATCH_SIZE:100}
########################################## database end ##########################################

########################################## redis start ##########################################
# TODO required!
spring.redis.host=${austin.redis.ip:austin-redis}
spring.redis.port=${austin.redis.port:6379}
spring.redis.password=${austin.redis.password:}
spring.redis.connect-timeout=10s
########################################## redis end ##########################################


########################################## kafka start ##########################################
spring.kafka.bootstrap-servers=${austin.kafka.ip:austin-kafka}:${austin.kafka.port:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.enable-auto-commit=true

###
austin.business.topic.name=austinBusiness
austin.business.recall.topic.name=austinRecall
austin.business.log.topic.name=austinTraceLog
austin.business.recall.group.name=recallGroupId
### TODO kafka tag filter,if you need, replace  tagIdValue ,eg:com.java3y.austin.yyy
austin.business.tagId.key=kafka_tag_id
austin.business.tagId.value=com.java3y.austin.3y
########################################## kafka end ##########################################


########################################## rocketMq start ##########################################
rocketmq.name-server=${austin.rocketmq.nameserver.ip:}:${austin.rocketmq.nameserver.port:}
rocketmq.producer.group=unique-producer-group
austin.rocketmq.biz.consumer.group=unique-biz-consumer-group
austin.rocketmq.recall.consumer.group=unique-recall-consumer-group
########################################## rocketMq end ##########################################


########################################## RabbitMq start ##########################################
spring.rabbitmq.host=${austin.rabbitmq.ip:}
spring.rabbitmq.port=${austin.rabbitmq.port:}
spring.rabbitmq.username=root
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.virtual-host=/
#enable retry
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-attempts=3
austin.rabbitmq.exchange.name=austin.point
spring.rabbitmq.queues.send=austin.queues.send
spring.rabbitmq.queues.recall=austin.queues.recall
austin.rabbitmq.routing.send=austin.send
austin.rabbitmq.routing.recall=austin.recall
spring.rabbitmq.queues.trace=austin.queues.trace
austin.rabbitmq.routing.trace=austin.trace
########################################## RabbitMq end ##########################################


########################################## xxl start ##########################################
xxl.job.admin.addresses=http://${austin.xxl.job.ip:austin-xxl-job}:${austin.xxl.job.port:8080}/xxl-job-admin
xxl.job.admin.username=${austin.xxl.job.username:admin}
xxl.job.admin.password=${austin.xxl.job.password:}
xxl.job.executor.appname=${austin.xxl.job.executor.appname:austin}
xxl.job.executor.jobHandlerName=${austin.xxl.job.executor.jobHandlerName:austinJob}
xxl.job.executor.address=${austin.xxl.job.address:}
xxl.job.executor.ip=
xxl.job.executor.port=${austin.xxl.executor.port:6666}
xxl.job.executor.logpath=logs/xxl
xxl.job.executor.logretentiondays=30
xxl.job.accessToken=${austin.xxl.job.accessToken:}
########################################## xxl end ##########################################

########################################## apollo start ##########################################
app.id=austin
apollo.bootstrap.enabled=${austin.apollo.enabled:false}
apollo.bootstrap.namespaces=${austin.default.apollo.namespace:boss.austin},dynamic-tp-apollo-dtp.yml
########################################## apollo end ##########################################

########################################## nacos start ##########################################
nacos.config.server-addr=${austin.nacos.addr.ip:austin-nacos}:${austin.nacos.addr.port:8848}
nacos.config.username=${austin.nacos.username:nacos}
nacos.config.password=${austin.nacos.password:}
nacos.config.namespace=${austin.nacos.namespace:hades}
nacos.config.enabled=${austin.nacos.enabled:false}

nacos.data-id=${austin.nacos.dataId:austin}
nacos.group=${austin.nacos.group:DEFAULT_GROUP}
########################################## nacos end ##########################################

########################################## rule Engine start ##########################################
hades.enabled=${austin.rule.engine.enabled:false}
hades.config-name=${austin.rule.engine.file-name:hades}
########################################## rule Engine end ##########################################

########################################## log start ##########################################
austin.graylog.ip=${austin.graylog:austin-graylog}
########################################## log end ##########################################


########################################## httpUtils start ##########################################
ok.http.connect-timeout=30
ok.http.keep-alive-duration=300
ok.http.max-idle-connections=200
ok.http.read-timeout=30
ok.http.write-timeout=30
########################################## httpUtils end ##########################################

########################################## monitor start ##########################################
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.export.prometheus.enabled=true
management.health.rabbit.enabled=false
########################################## monitor end ##########################################

########################################## system start ##########################################
server.shutdown=graceful
########################################## system end ##########################################
