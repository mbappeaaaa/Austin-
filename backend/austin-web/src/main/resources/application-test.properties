server.port=7777

# TODO  choose : [kafka]/[eventBus]/[rocketMq]/[rabbitMq],recommend  [eventBus] or  [kafka]
austin.mq.pipeline=kafka

# todo [xxl-job] switch
austin.xxl.job.enabled=true

# todo choose: [apollo]/[nacos] switch  ,if [apollo] and [nacos] both false, use local.properties
austin.apollo.enabled=false
austin.nacos.enabled=true

# TODO [hades] switch
austin.rule.engine.enabled=true

# TODO if windows os and need upload file to send message  ,replace path !
austin.business.upload.crowd.path=/Users/3y/temp

# TODO Whether to enable [sensitive word filter] and set the [path] of sensitive words dictionary
austin.senswords.filter.enabled=true
austin.senswords.dict.path=classpath:sensitive-words.txt

# Legacy WeChat QR login is disabled by default. Enable it only with external secrets.
austin.login.official.account.enable=${AUSTIN_OFFICIAL_ACCOUNT_LOGIN_ENABLED:false}
austin.login.official.account.appId=${AUSTIN_OFFICIAL_ACCOUNT_APP_ID:}
austin.login.official.account.secret=${AUSTIN_OFFICIAL_ACCOUNT_SECRET:}
austin.login.official.account.token=${AUSTIN_OFFICIAL_ACCOUNT_TOKEN:}
